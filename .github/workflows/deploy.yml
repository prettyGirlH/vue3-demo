name: Build and Deploy Vue App to gh-pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 强制使用 Node.js 24（解决弃用警告）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # 使用 Node.js 22
          
      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v4
        with:
          version: 8  # 或者你本地使用的 pnpm 版本，如 9
          
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
          
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
          
      - name: Install Dependencies 📦
        run: pnpm install --frozen-lockfile
        # --frozen-lockfile 等同于 npm ci，会根据 pnpm-lock.yaml 严格安装
        
      - name: Build Project 🏗️
        run: pnpm run build
        
      - name: Deploy to gh-pages branch 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          
      - name: 输出部署信息
        run: |
          echo "✅ 部署完成！"
          echo "🌐 访问地址: https://$(git config user.name).github.io/${GITHUB_REPOSITORY#*/}"